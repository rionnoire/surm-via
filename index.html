<!DOCTYPE html>
<html>
<head>
  <title>Dobot Checkers</title>
  <style>
    body { font-family: sans-serif; padding: 10px; background: #1a1a1a; color: #eee; }
    h2 { margin-bottom: 4px; }
    #container { position: relative; display: inline-block; }
    video { display: block; }
    #overlay { position: absolute; top: 0; left: 0; cursor: crosshair; }
    #c1 { display: none; }
    button {
      margin: 6px 4px; padding: 8px 16px;
      background: #444; color: #eee;
      border: none; border-radius: 4px;
      cursor: pointer; font-size: 14px;
    }
    button:hover { background: #666; }
    #status { margin: 8px 0; font-size: 14px; color: #aaa; }
    #bestMove { margin: 8px 0; font-size: 16px; font-weight: bold; color: #7fc; }
    #boardDisplay {
      display: grid;
      grid-template-columns: repeat(4, 60px);
      gap: 2px;
      margin: 10px 0;
    }
    .cell {
      width: 60px; height: 60px;
      background: #333; border-radius: 4px;
      display: flex; align-items: center;
      justify-content: center; font-size: 22px;
    }
    .highlight { outline: 3px solid #7fc; }
  </style>
</head>
<body>
  <h2>Dobot Checkers</h2>

  <div id="container">
    <video id="v1" width="320" height="240" autoplay muted playsinline></video>
    <canvas id="overlay" width="320" height="240"></canvas>
  </div>
  <canvas id="c1" width="240" height="240"></canvas>

  <br>
  <button id="startBtn">Start Camera</button>
  <button id="captureBtn" disabled>Capture Board</button>

  <div id="status">Camera not started.</div>
  <div id="bestMove"></div>
  <div id="boardDisplay"></div>

  <script>
    // ── Engine ───────────────────────────────────────────────────────
    // RED (opponent) starts at rows 0-1, moves DOWN (dr=+1)
    // GREEN/WHITE (dobot) starts at rows 2-3, moves UP (dr=-1)
    // Move: one step straight forward
    // Capture: one step diagonally forward onto enemy square

    const EMPTY=0, RED=1, GREEN=2;

    function isRed(p)   { return p===RED; }
    function isGreen(p) { return p===GREEN; }
    function belongs(p,t) { return t===RED ? isRed(p) : isGreen(p); }
    function isEnemy(p,t) { return t===RED ? isGreen(p) : isRed(p); }

    function getMoves(b, r, c, t) {
      const dr = t===RED ? 1 : -1; // red moves down, green moves up
      const moves = [];
      const nr = r + dr;
      if (nr < 0 || nr > 3) return moves;

      // straight forward
      if (b[nr][c] === EMPTY)
        moves.push({ r:nr, c:c, capR:null, capC:null });

      // diagonal captures
      for (const dc of [-1, 1]) {
        const nc = c + dc;
        if (nc >= 0 && nc <= 3 && isEnemy(b[nr][nc], t))
          moves.push({ r:nr, c:nc, capR:nr, capC:nc });
      }
      return moves;
    }

    function getAllMoves(b, t) {
      const all = [];
      for (let r=0; r<4; r++)
        for (let c=0; c<4; c++)
          if (belongs(b[r][c], t))
            getMoves(b,r,c,t).forEach(m => all.push({...m, fromR:r, fromC:c}));
      return all;
    }

    function cloneBoard(b) { return b.map(r=>[...r]); }

    function applyMove(b, m) {
      const nb = cloneBoard(b);
      if (m.capR !== null) nb[m.capR][m.capC] = EMPTY;
      nb[m.r][m.c] = nb[m.fromR][m.fromC];
      nb[m.fromR][m.fromC] = EMPTY;
      return nb;
    }

    function countPieces(b) {
      let r=0, g=0;
      for (let i=0;i<4;i++) for (let j=0;j<4;j++) {
        if (b[i][j]===RED)   r++;
        if (b[i][j]===GREEN) g++;
      }
      return {red:r, green:g};
    }

    function checkWinner(b) {
      // win by reaching other side
      for (let c=0;c<4;c++) {
        if (b[3][c]===RED)   return RED;   // red reached bottom row
        if (b[0][c]===GREEN) return GREEN; // green reached top row
      }
      return null;
    }

    // Simple dobot AI: prefer captures, else advance most
    function chooseDobotMove(b) {
      const moves = getAllMoves(b, GREEN);
      if (moves.length===0) return null;
      const caps = moves.filter(m => m.capR !== null);
      const pool = caps.length > 0 ? caps : moves;
      // prefer move that goes furthest up (lowest row number)
      pool.sort((a,b) => a.r - b.r);
      return pool[0];
    }

    // ── Color inference ──────────────────────────────────────────────
    function inferPiece(r, g, b) {
      const max = Math.max(r, g, b);
      if (max < 60) return EMPTY;
      if (r > g * 1.5 && r > b * 1.5) return RED;
      if (g > r * 1.5 && g > b * 1.5) return GREEN;
      return EMPTY;
    }

    // ── Camera & UI ──────────────────────────────────────────────────
    let player, c, g, ov, og;
    let crop = null;
    let dragging = false, dragStart = null, dragEnd = null;

    const colLabels = ['A','B','C','D'];
    const rowLabels = ['1','2','3','4'];

    function moveToText(m) {
      if (!m) return "No moves available for Dobot.";
      const from = colLabels[m.fromC] + rowLabels[m.fromR];
      const to   = colLabels[m.c]     + rowLabels[m.r];
      return m.capR !== null
        ? `Dobot: ${from} → ${to}  (capture!)`
        : `Dobot: ${from} → ${to}`;
    }

    function getSamplePoints(w, h) {
      const pts = [];
      const stepX = w/5, stepY = h/5;
      for (let row=1; row<=4; row++)
        for (let col=1; col<=4; col++)
          pts.push({ x:Math.floor(stepX*col), y:Math.floor(stepY*row) });
      return pts;
    }

    function toVideoCoords(cx, cy) {
      return {
        x: Math.floor(cx * player.videoWidth  / ov.width),
        y: Math.floor(cy * player.videoHeight / ov.height)
      };
    }

    function drawBox(x1, y1, x2, y2) {
      og.clearRect(0, 0, ov.width, ov.height);
      const x = Math.min(x1,x2), y = Math.min(y1,y2);
      const side = Math.max(Math.abs(x2-x1), Math.abs(y2-y1));
      og.strokeStyle = '#7fc';
      og.lineWidth = 2;
      og.setLineDash([5,3]);
      og.strokeRect(x, y, side, side);
    }

    function renderBoard(board, bestMove) {
      const div = document.getElementById("boardDisplay");
      div.innerHTML = '';
      for (let r=0; r<4; r++) {
        for (let c=0; c<4; c++) {
          const cell = document.createElement("div");
          cell.className = "cell";
          if (bestMove && ((r===bestMove.fromR && c===bestMove.fromC) || (r===bestMove.r && c===bestMove.c)))
            cell.classList.add("highlight");
          const p = board[r][c];
          if (p===RED)   cell.textContent = '🔴';
          if (p===GREEN) cell.textContent = '🟢';
          div.appendChild(cell);
        }
      }
    }

    function capture() {
      if (!player || player.readyState < 2 || !crop) {
        document.getElementById("status").textContent = "Camera not ready or no crop selected.";
        return;
      }

      g.drawImage(player, crop.sx, crop.sy, crop.size, crop.size, 0, 0, c.width, c.height);

      const pts = getSamplePoints(c.width, c.height);
      const board = Array(4).fill(null).map(()=>Array(4).fill(EMPTY));
      pts.forEach(({x,y}, i) => {
        const [r,gv,b] = g.getImageData(x,y,1,1).data;
        board[Math.floor(i/4)][i%4] = inferPiece(r, gv, b);
      });

      const winner = checkWinner(board);
      if (winner) {
        document.getElementById("status").textContent = winner===RED ? "Opponent wins!" : "Dobot wins!";
        document.getElementById("bestMove").textContent = '';
        renderBoard(board, null);
        return;
      }

      const best = chooseDobotMove(board);
      document.getElementById("status").textContent = "Board captured.";
      document.getElementById("bestMove").textContent = moveToText(best);
      renderBoard(board, best);
    }

    document.getElementById("startBtn").addEventListener("click", async () => {
      player = document.getElementById("v1");
      c = document.getElementById("c1");
      g = c.getContext("2d");
      ov = document.getElementById("overlay");
      og = ov.getContext("2d");

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        player.srcObject = stream;
        await player.play();
        const vw = player.videoWidth, vh = player.videoHeight;
        const size = Math.min(vw, vh);
        crop = { sx: Math.floor((vw-size)/2), sy: Math.floor((vh-size)/2), size };
        document.getElementById("captureBtn").disabled = false;
        document.getElementById("status").textContent = "Ready. Draw crop area or capture directly.";
      } catch(err) {
        alert("Camera failed: " + err.name + " – " + err.message);
      }

      ov.addEventListener("mousedown", e => {
        dragging = true;
        dragStart = { x:e.offsetX, y:e.offsetY };
        dragEnd = null;
      });
      ov.addEventListener("mousemove", e => {
        if (!dragging) return;
        dragEnd = { x:e.offsetX, y:e.offsetY };
        drawBox(dragStart.x, dragStart.y, dragEnd.x, dragEnd.y);
      });
      ov.addEventListener("mouseup", e => {
        if (!dragging) return;
        dragging = false;
        dragEnd = { x:e.offsetX, y:e.offsetY };
        const side = Math.max(Math.abs(dragEnd.x-dragStart.x), Math.abs(dragEnd.y-dragStart.y));
        const tl = toVideoCoords(Math.min(dragStart.x,dragEnd.x), Math.min(dragStart.y,dragEnd.y));
        crop = { sx:tl.x, sy:tl.y, size: toVideoCoords(Math.min(dragStart.x,dragEnd.x)+side, 0).x - tl.x };
      });

      ov.addEventListener("touchstart", e => {
        e.preventDefault();
        const rect = ov.getBoundingClientRect(), t = e.touches[0];
        dragging = true;
        dragStart = { x:t.clientX-rect.left, y:t.clientY-rect.top };
        dragEnd = null;
      }, { passive:false });
      ov.addEventListener("touchmove", e => {
        e.preventDefault();
        if (!dragging) return;
        const rect = ov.getBoundingClientRect(), t = e.touches[0];
        dragEnd = { x:t.clientX-rect.left, y:t.clientY-rect.top };
        drawBox(dragStart.x, dragStart.y, dragEnd.x, dragEnd.y);
      }, { passive:false });
      ov.addEventListener("touchend", e => {
        e.preventDefault();
        if (!dragging || !dragEnd) return;
        dragging = false;
        const side = Math.max(Math.abs(dragEnd.x-dragStart.x), Math.abs(dragEnd.y-dragStart.y));
        const tl = toVideoCoords(Math.min(dragStart.x,dragEnd.x), Math.min(dragStart.y,dragEnd.y));
        crop = { sx:tl.x, sy:tl.y, size: toVideoCoords(Math.min(dragStart.x,dragEnd.x)+side, 0).x - tl.x };
      }, { passive:false });
    });

    document.getElementById("captureBtn").addEventListener("click", capture);
  </script>
</body>
</html>
