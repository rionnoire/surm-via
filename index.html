<!DOCTYPE html>
<html>
<head>
  <title>Dobot Checkers</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cascadia+Code:ital,wght@0,200..700;1,200..700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #A691B3; --panel: #C98DA3; --border: #FFAFCC;
      --accent: #BDE0FE; --accent2: #A2D2FF; --text: #BDE0FE; --dim: #A2D2FF;
      --mono: 'Cascadia Code', monospace; --sans: 'Exo 2', sans-serif;
    }
    body {
      font-family: var(--sans); background: var(--bg); color: var(--text);
      min-height: 100vh; padding: 20px;
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(0,229,160,0.05) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(255,68,102,0.05) 0%, transparent 50%);
    }
    h2 {
      font-family: var(--mono); font-size: 1.1rem; letter-spacing: 0.15em;
      color: var(--accent); text-transform: uppercase; margin-bottom: 16px;
      display: flex; align-items: center; gap: 10px;
    }
    h2::before {
      content: ''; display: inline-block; width: 8px; height: 8px;
      background: var(--accent); border-radius: 50%; box-shadow: 0 0 8px var(--accent);
    }
    #container { position: relative; display: inline-block; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    video { display: block; }
    #overlay { position: absolute; top: 0; left: 0; cursor: crosshair; }
    #c1 { display: none; }
    .controls { margin: 12px 0; display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      padding: 8px 18px; background: var(--panel); color: var(--accent);
      border: 1px solid var(--accent); border-radius: 4px; cursor: pointer;
      font-family: var(--mono); font-size: 0.8rem; letter-spacing: 0.1em;
      text-transform: uppercase; transition: all 0.15s;
    }
    button:hover:not(:disabled) { background: var(--accent); color: var(--bg); box-shadow: 0 0 12px rgba(0,229,160,0.4); }
    button:disabled { opacity: 0.35; cursor: default; border-color: var(--dim); color: var(--dim); }
    #status { font-family: var(--mono); font-size: 0.78rem; color: var(--dim); margin: 6px 0; min-height: 1.2em; }
    #pushStatus {
      font-family: var(--mono); font-size: 0.72rem; margin: 4px 0;
      min-height: 1.1em; transition: color 0.3s;
    }
    #pushStatus.pushing { color: #ffcc00; }
    #pushStatus.ok      { color: var(--accent); }
    #pushStatus.err     { color: var(--accent2); }
    #bestMove {
      font-family: var(--mono); font-size: 1.1rem; font-weight: 600;
      color: var(--accent); margin: 8px 0 4px; min-height: 1.6em; letter-spacing: 0.05em;
    }
    #bestMove.capture { color: #ffcc00; }
    #bestMove.none    { color: var(--accent2); }
    #debugOut {
      font-family: var(--mono); font-size: 0.72rem; color: #aaa;
      margin: 4px 0 10px; white-space: pre-wrap;
      background: #111; padding: 8px; border-radius: 4px; border: 1px solid #222;
    }
    #boardDisplay, #manualBoard {
      display: grid;
      grid-template-columns: 30px repeat(4, 52px);
      grid-template-rows: 30px repeat(4, 52px);
      gap: 3px; margin: 4px 0 16px;
    }
    .col-label, .row-label {
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-size: 0.7rem; color: var(--dim);
    }
    .cell {
      width: 52px; height: 52px; background: var(--panel);
      border: 1px solid var(--border); border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; transition: box-shadow 0.2s, border-color 0.2s;
    }
    .cell.from { border-color: var(--accent); box-shadow: 0 0 10px rgba(0,229,160,0.4); }
    .cell.to   { border-color: #ffcc00;       box-shadow: 0 0 10px rgba(255,204,0,0.4); }
    .cell.clickable { cursor: pointer; }
    .cell.clickable:hover { border-color: var(--dim); }
    #legend { display: flex; gap: 16px; font-family: var(--mono); font-size: 0.72rem; color: var(--dim); margin-bottom: 8px; }
    #legend span { display: flex; align-items: center; gap: 5px; }
    details { margin-top: 14px; }
    summary { font-family: var(--mono); font-size: 0.8rem; color: var(--dim); cursor: pointer; user-select: none; }
    #manualResult { font-family: var(--mono); font-size: 1rem; color: var(--accent); margin-top: 8px; min-height: 1.4em; }
    #debugColors { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  </style>
</head>
<body>
  <h2>Dobot Checkers</h2>

  <div id="container">
    <video id="v1" width="320" height="240" autoplay muted playsinline></video>
    <canvas id="overlay" width="320" height="240"></canvas>
  </div>
  <canvas id="c1" width="240" height="240"></canvas>

  <div class="controls">
    <button id="startBtn">kaamera!</button>
    <button id="captureBtn" disabled>capture</button>
  </div>

  <div style="margin:10px 0;display:flex;align-items:center;gap:8px;">
    <label style="font-family:var(--mono);font-size:0.75rem;color:var(--dim);white-space:nowrap;">token</label>
    <input id="tokenInput" type="password" placeholder="github_pat_…"
      style="flex:1;max-width:320px;background:var(--panel);border:1px solid var(--border);border-radius:4px;
             padding:6px 10px;font-family:var(--mono);font-size:0.75rem;color:var(--text);outline:none;"
      oninput="localStorage.setItem('gh_token',this.value)"
    />
  </div>

  <div id="status">kaamera?</div>
  <div id="pushStatus"></div>
  <div id="bestMove"></div>
  <div id="debugOut"></div>

  <div id="legend">
    <span>🎶 - vastane</span>
    <span>🤖 - robot</span>
  </div>
  <div id="boardDisplay"></div>

  <details>
    <summary>manuaalne lauamanipulatsioon</summary>
    <p style="font-family:var(--mono);font-size:0.72rem;color:var(--dim);margin:8px 0 4px;">tsükkel tühi → 🎶 → 🤖 → tühi</p>
    <div id="manualBoard"></div>
    <button id="solveManual">Solve Manual Board</button>
    <div id="manualResult"></div>
  </details>

  <details style="margin-top:10px;">
    <summary>kontrolli värve</summary>
    <div id="debugColors"></div>
    <p style="font-family:var(--mono);font-size:0.7rem;color:var(--dim);margin-top:4px;">
      ääred on valitud kategooria (laud, vastane, robot)
    </p>
  </details>

  <script>

// ── Config ───────────────────────────────────────────────────────
function GITHUB_TOKEN() { return document.getElementById('tokenInput').value.trim(); }
const GITHUB_USER  = 'rionnoire';
const GITHUB_REPO  = 'surm-via';
const FILE_PATH    = 'move.csv';

// ── Push move to move.csv via GitHub API ─────────────────────────
let cachedSha = null;  // add this at the top with your other globals

async function pushMove(m) {
  if (!m) return;
  const pushEl = document.getElementById('pushStatus');
  pushEl.className = 'pushing';
  pushEl.textContent = 'kirjutab';

  const from      = COL[m.fromC] + ROW[m.fromR];
  const to = m.bounce
    ? COL[m.fromC] + ROW[m.fromR + m.newDir]
    : COL[m.c] + ROW[m.r];
  const capture   = m.capR !== null ? 'yes' : 'no';
  const timestamp = new Date().toISOString();
  const csv       = `from,to,capture,timestamp\n${from},${to},${capture},${timestamp}`;

  try {
    // Only fetch SHA if we don't have it cached
    if (!cachedSha) {
      const infoRes = await fetch(
        `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`,
        { headers: { Authorization: `Bearer ${GITHUB_TOKEN()}`, 'X-GitHub-Api-Version': '2022-11-28' } }
      );
      const info = await infoRes.json();
      cachedSha = info.sha || null;
    }

    const putBody = { message: 'update move', content: btoa(csv) };
    if (cachedSha) putBody.sha = cachedSha;

    const putRes = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`,
      {
        method: 'PUT',
        headers: { Authorization: `Bearer ${GITHUB_TOKEN()}`, 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' },
        body: JSON.stringify(putBody)
      }
    );

    if (putRes.ok) {
      const result = await putRes.json();
      cachedSha = result.content.sha;  // ← update cache with new SHA
      pushEl.className = 'ok';
      pushEl.textContent = `liigutus → ${from} → ${to}  (${timestamp.slice(11,19)} UTC)`;
    } else {
      const err = await putRes.json();
      cachedSha = null;  // ← invalidate cache on error so next attempt re-fetches
      pushEl.className = 'err';
      pushEl.textContent = `git error ${err.message}`;
    }
  } catch (e) {
    cachedSha = null;
    pushEl.className = 'err';
    pushEl.textContent = `net error ${e.message}`;
  }
}

  // ── Constants ────────────────────────────────────────────────────
  const EMPTY = 0, RED = 1, GREEN = 2;
  const COL = ['A','B','C','D'];
  const ROW = ['1','2','3','4'];

  // ── Board helpers ────────────────────────────────────────────────
  function cloneBoard(b) { return b.map(r => [...r]); }

  function countPieces(b) {
    let red = 0, green = 0;
    for (let r = 0; r < 4; r++)
      for (let c = 0; c < 4; c++) {
        if (b[r][c] === RED)   red++;
        if (b[r][c] === GREEN) green++;
      }
    return { red, green };
  }

  // ── Direction board ──────────────────────────────────────────────
  function buildDirBoard(b) {
    return b.map(row => row.map(p => p === RED ? 1 : p === GREEN ? -1 : 0));
  }

  // ── Move generation (with bounce) ────────────────────────────────
  function getMoves(board, dirBoard, r, c, t) {
    const dir = dirBoard[r][c];
    const moves = [];
    const nr = r + dir;

    if (nr < 0 || nr > 3) {
      moves.push({ fromR:r, fromC:c, r:r, c:c, capR:null, capC:null, newDir:-dir, bounce:true });
      return moves;
    }

    if (board[nr][c] === EMPTY)
      moves.push({ fromR:r, fromC:c, r:nr, c:c, capR:null, capC:null, newDir:dir, bounce:false });

    for (const dc of [-1, 1]) {
      const nc = c + dc;
      if (nc >= 0 && nc <= 3) {
        const enemy = t === RED ? GREEN : RED;
        if (board[nr][nc] === enemy)
          moves.push({ fromR:r, fromC:c, r:nr, c:nc, capR:nr, capC:nc, newDir:dir, bounce:false });
      }
    }
    return moves;
  }

  function getAllMoves(board, dirBoard, t) {
    const all = [];
    for (let r = 0; r < 4; r++)
      for (let c = 0; c < 4; c++)
        if (board[r][c] === t)
          getMoves(board, dirBoard, r, c, t).forEach(m => all.push(m));
    return all;
  }

  function applyMove(board, dirBoard, m) {
    const nb  = cloneBoard(board);
    const ndb = cloneBoard(dirBoard);
    if (m.bounce) {
      ndb[m.r][m.c] = m.newDir;
      return { board: nb, dirBoard: ndb };
    }
    if (m.capR !== null) { nb[m.capR][m.capC] = EMPTY; ndb[m.capR][m.capC] = 0; }
    nb[m.r][m.c]          = nb[m.fromR][m.fromC];
    ndb[m.r][m.c]         = m.newDir;
    nb[m.fromR][m.fromC]  = EMPTY;
    ndb[m.fromR][m.fromC] = 0;
    return { board: nb, dirBoard: ndb };
  }

  // ── Minimax with alpha-beta ──────────────────────────────────────
  function evaluate(board) {
    const { red, green } = countPieces(board);
    if (red   === 0) return  1000;
    if (green === 0) return -1000;
    let score = (green - red) * 10;
    for (let r = 0; r < 4; r++)
      for (let c = 0; c < 4; c++) {
        if (board[r][c] === GREEN) score += (3 - r);
        if (board[r][c] === RED)   score -= r;
      }
    return score;
  }

  function minimax(board, dirBoard, depth, alpha, beta, isMax) {
    const { red, green } = countPieces(board);
    if (red   === 0) return  1000 + depth;
    if (green === 0) return -1000 - depth;
    if (depth === 0) return evaluate(board);

    const t     = isMax ? GREEN : RED;
    const moves = getAllMoves(board, dirBoard, t);
    if (moves.length === 0) return isMax ? -900 : 900;

    if (isMax) {
      let best = -Infinity;
      for (const m of moves) {
        const s = applyMove(board, dirBoard, m);
        best  = Math.max(best, minimax(s.board, s.dirBoard, depth-1, alpha, beta, false));
        alpha = Math.max(alpha, best);
        if (beta <= alpha) break;
      }
      return best;
    } else {
      let best = Infinity;
      for (const m of moves) {
        const s = applyMove(board, dirBoard, m);
        best = Math.min(best, minimax(s.board, s.dirBoard, depth-1, alpha, beta, true));
        beta = Math.min(beta, best);
        if (beta <= alpha) break;
      }
      return best;
    }
  }

  function chooseDobotMove(board, dirBoard) {
    const moves = getAllMoves(board, dirBoard, GREEN);
    if (moves.length === 0) return null;
    let bestVal = -Infinity, bestMove = null;
    for (const m of moves) {
      const s   = applyMove(board, dirBoard, m);
      const val = minimax(s.board, s.dirBoard, 4, -Infinity, Infinity, false);
      if (val > bestVal) { bestVal = val; bestMove = m; }
    }
    return bestMove;
  }

  // ── Move to text ─────────────────────────────────────────────────
  function moveToText(m) {
    if (!m)       return "No moves available.";
    if (m.bounce) return `BOUNCE: ${COL[m.fromC]}${ROW[m.fromR]} reverses direction`;
    const from = COL[m.fromC] + ROW[m.fromR];
    const to   = COL[m.c]     + ROW[m.r];
    return m.capR !== null ? `${from} → ${to}  !!!` : `${from} → ${to}`;
  }

  // ── Render board ─────────────────────────────────────────────────
  function renderBoard(targetId, board, best) {
    const div = document.getElementById(targetId);
    div.innerHTML = '';
    const corner = document.createElement('div');
    corner.className = 'col-label';
    div.appendChild(corner);
    for (const l of COL) {
      const el = document.createElement('div');
      el.className = 'col-label'; el.textContent = l; div.appendChild(el);
    }
    for (let r = 0; r < 4; r++) {
      const rl = document.createElement('div');
      rl.className = 'row-label'; rl.textContent = ROW[r]; div.appendChild(rl);
      for (let c = 0; c < 4; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        if (best && !best.bounce) {
          if (r === best.fromR && c === best.fromC) cell.classList.add('from');
          if (r === best.r     && c === best.c)     cell.classList.add('to');
        }
        const p = board[r][c];
        cell.textContent = p === RED ? '🎶' : p === GREEN ? '🤖' : '';
        div.appendChild(cell);
      }
    }
  }

  // ── Solve, display, and push ─────────────────────────────────────
  function solve(board) {
    const dirBoard       = buildDirBoard(board);
    const { red, green } = countPieces(board);
    const bmEl           = document.getElementById("bestMove");
    const dbgEl          = document.getElementById("debugOut");

    if (red === 0) {
      bmEl.textContent = "ai supremacy"; bmEl.className = '';
      renderBoard("boardDisplay", board, null); return;
    }
    if (green === 0) {
      bmEl.textContent = "stupid bot hihi"; bmEl.className = '';
      renderBoard("boardDisplay", board, null); return;
    }

    const best = chooseDobotMove(board, dirBoard);
    const text = moveToText(best);

    dbgEl.textContent =
      `pieces — red: ${red}  green: ${green}\n` +
      `available green moves: ${getAllMoves(board, dirBoard, GREEN).length}\n` +
      `chosen move: ${JSON.stringify(best)}`;

    bmEl.textContent = text;
    bmEl.className   = best ? (best.capR !== null ? 'capture' : '') : 'none';
    renderBoard("boardDisplay", board, best);

    // ← THE FIX: actually write the move to GitHub
    pushMove(best);
  }

  // ── Color inference ──────────────────────────────────────────────
  function inferPiece(r, g, b) {
    const max = Math.max(r, g, b);
    if (max < 50) return EMPTY;
    if (r > g * 1.6 && r > b * 1.6) return RED;
    if (g > r * 1.6 && g > b * 1.6) return GREEN;
    return EMPTY;
  }

  // ── Debug color swatches ─────────────────────────────────────────
  function showDebugColors(samples) {
    const div = document.getElementById("debugColors");
    div.innerHTML = '';
    samples.forEach(({ r, g, b, piece }, i) => {
      const label = piece === RED ? 'R' : piece === GREEN ? 'G' : '·';
      const el = document.createElement('div');
      el.title = `sq${i} RGB(${r},${g},${b})`;
      el.style.cssText = `
        width:34px;height:34px;border-radius:4px;
        background:rgb(${r},${g},${b});
        border:2px solid ${piece===RED?'#ff4466':piece===GREEN?'#00e5a0':'#333'};
        display:flex;align-items:center;justify-content:center;
        font-size:11px;font-family:var(--mono);color:#fff;text-shadow:0 0 3px #000;
      `;
      el.textContent = label;
      div.appendChild(el);
    });
  }

  // ── Capture ──────────────────────────────────────────────────────
  let player, cnv, ctx, ovCanvas, ovCtx;
  let crop = null, dragging = false, dragStart = null, dragEnd = null;

  function getSamplePoints(w, h) {
    const pts = [], stepX = w / 5, stepY = h / 5;
    for (let row = 1; row <= 4; row++)
      for (let col = 1; col <= 4; col++)
        pts.push({ x: Math.floor(stepX * col), y: Math.floor(stepY * row) });
    return pts;
  }

  function toVideoCoords(cx, cy) {
    return {
      x: Math.floor(cx * player.videoWidth  / ovCanvas.width),
      y: Math.floor(cy * player.videoHeight / ovCanvas.height)
    };
  }

  function drawBox(x1, y1, x2, y2) {
    ovCtx.clearRect(0, 0, ovCanvas.width, ovCanvas.height);
    const x = Math.min(x1,x2), y = Math.min(y1,y2);
    const side = Math.max(Math.abs(x2-x1), Math.abs(y2-y1));
    ovCtx.strokeStyle = '#00e5a0'; ovCtx.lineWidth = 2; ovCtx.setLineDash([5,3]);
    ovCtx.strokeRect(x, y, side, side);
  }

  document.getElementById("captureBtn").addEventListener("click", () => {
    if (!player || player.readyState < 2 || !crop) {
      document.getElementById("status").textContent = "parem kaamera pls";
      return;
    }
    ctx.drawImage(player, crop.sx, crop.sy, crop.size, crop.size, 0, 0, cnv.width, cnv.height);

    const pts   = getSamplePoints(cnv.width, cnv.height);
    const board = Array(4).fill(null).map(() => Array(4).fill(EMPTY));
    const dbg   = [];

    pts.forEach(({ x, y }, i) => {
      const d = ctx.getImageData(x, y, 1, 1).data;
      const [r, g, b] = [d[0], d[1], d[2]];
      const piece = inferPiece(r, g, b);
      board[Math.floor(i / 4)][i % 4] = piece;
      dbg.push({ r, g, b, piece });
    });

    showDebugColors(dbg);
    const { red, green } = countPieces(board);
    document.getElementById("status").textContent = `hei! — 🎶 ${red}  🤖 ${green}`;
    solve(board);
  });

  // ── Start camera ─────────────────────────────────────────────────
  document.getElementById("startBtn").addEventListener("click", async () => {
    player   = document.getElementById("v1");
    cnv      = document.getElementById("c1");
    ctx      = cnv.getContext("2d");
    ovCanvas = document.getElementById("overlay");
    ovCtx    = ovCanvas.getContext("2d");

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      player.srcObject = stream;
      await player.play();
      const vw = player.videoWidth, vh = player.videoHeight;
      const size = Math.min(vw, vh);
      crop = { sx: Math.floor((vw-size)/2), sy: Math.floor((vh-size)/2), size };
      document.getElementById("captureBtn").disabled = false;
      document.getElementById("status").textContent  = "hakka croppima crop boy";
    } catch (err) {
      alert("Camera failed: " + err.name + " – " + err.message);
    }

    ovCanvas.addEventListener("mousedown", e => {
      dragging = true; dragStart = { x:e.offsetX, y:e.offsetY }; dragEnd = null;
    });
    ovCanvas.addEventListener("mousemove", e => {
      if (!dragging) return;
      dragEnd = { x:e.offsetX, y:e.offsetY };
      drawBox(dragStart.x, dragStart.y, dragEnd.x, dragEnd.y);
    });
    ovCanvas.addEventListener("mouseup", e => {
      if (!dragging) return; dragging = false;
      dragEnd = { x:e.offsetX, y:e.offsetY };
      const side = Math.max(Math.abs(dragEnd.x-dragStart.x), Math.abs(dragEnd.y-dragStart.y));
      const tl = toVideoCoords(Math.min(dragStart.x,dragEnd.x), Math.min(dragStart.y,dragEnd.y));
      const tr = toVideoCoords(Math.min(dragStart.x,dragEnd.x)+side, 0);
      crop = { sx:tl.x, sy:tl.y, size:tr.x-tl.x };
    });
    ovCanvas.addEventListener("touchstart", e => {
      e.preventDefault();
      const rect = ovCanvas.getBoundingClientRect(), t = e.touches[0];
      dragging = true; dragStart = { x:t.clientX-rect.left, y:t.clientY-rect.top }; dragEnd = null;
    }, { passive:false });
    ovCanvas.addEventListener("touchmove", e => {
      e.preventDefault(); if (!dragging) return;
      const rect = ovCanvas.getBoundingClientRect(), t = e.touches[0];
      dragEnd = { x:t.clientX-rect.left, y:t.clientY-rect.top };
      drawBox(dragStart.x, dragStart.y, dragEnd.x, dragEnd.y);
    }, { passive:false });
    ovCanvas.addEventListener("touchend", e => {
      e.preventDefault(); if (!dragging || !dragEnd) return; dragging = false;
      const side = Math.max(Math.abs(dragEnd.x-dragStart.x), Math.abs(dragEnd.y-dragStart.y));
      const tl = toVideoCoords(Math.min(dragStart.x,dragEnd.x), Math.min(dragStart.y,dragEnd.y));
      const tr = toVideoCoords(Math.min(dragStart.x,dragEnd.x)+side, 0);
      crop = { sx:tl.x, sy:tl.y, size:tr.x-tl.x };
    }, { passive:false });
  });

  // ── Manual board editor ──────────────────────────────────────────
  const manualState = Array(4).fill(null).map(() => Array(4).fill(EMPTY));

  function buildManualEditor() {
    const grid = document.getElementById("manualBoard");
    grid.innerHTML = '';
    const corner = document.createElement('div');
    corner.className = 'col-label'; grid.appendChild(corner);
    for (const l of COL) {
      const el = document.createElement('div');
      el.className = 'col-label'; el.textContent = l; grid.appendChild(el);
    }
    for (let r = 0; r < 4; r++) {
      const rl = document.createElement('div');
      rl.className = 'row-label'; rl.textContent = ROW[r]; grid.appendChild(rl);
      for (let c = 0; c < 4; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell clickable';
        cell.style.opacity = '0.4';
        cell.addEventListener('click', () => {
          manualState[r][c] = (manualState[r][c] + 1) % 3;
          cell.textContent  = manualState[r][c] === RED ? '🎶' : manualState[r][c] === GREEN ? '🤖' : '';
          cell.style.opacity = manualState[r][c] === EMPTY ? '0.4' : '1';
        });
        grid.appendChild(cell);
      }
    }
  }

  document.getElementById("solveManual").addEventListener("click", () => {
    const board = manualState.map(row => [...row]);
    const { red, green } = countPieces(board);
    document.getElementById("status").textContent = `manuaal 🎶 ${red}  🤖 ${green}`;
    solve(board);  // pushMove is called inside solve()
    document.getElementById("manualResult").textContent = document.getElementById("bestMove").textContent;
  });

  buildManualEditor();

  // restore saved token
  const saved = localStorage.getItem('gh_token');
  if (saved) document.getElementById('tokenInput').value = saved;
  </script>
</body>
</html>
